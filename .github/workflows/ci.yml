name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild to pick up base-image security fixes
  workflow_dispatch:

jobs:
  panel:
    name: Panel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r services/admin-panel/requirements-dev.txt

      - name: Run tests
        run: .venv/bin/pytest services/admin-panel

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: shellcheck
        run: shellcheck setup-pi.sh setup-tailscale.sh restore.sh services/backup-sync/*.sh

      - name: bats
        run: bats tests/

  publish:
    name: Publish ${{ matrix.image }}
    needs: [panel, scripts]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: admin-panel
            image: mc-stack-panel
          - service: backup-sync
            image: mc-stack-backup-sync
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lasserogers/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
