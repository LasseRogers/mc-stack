name: CI

on:
  push:
  pull_request:

jobs:
  panel:
    name: Panel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r services/admin-panel/requirements-dev.txt

      - name: Run tests
        run: .venv/bin/pytest services/admin-panel

  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: shellcheck
        run: shellcheck setup-pi.sh setup-tailscale.sh restore.sh services/backup-sync/*.sh

      - name: bats
        run: bats tests/
